name: Баг
description: Что-то работает не так
labels: [bug]
body:
  - type: dropdown
    id: revit-version
    attributes:
      label: Версия Revit
      options:
        - "2021"
        - "2023"
        - "2025"
        - Другая
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Версия плагина
      description: Например, из имени установщика — SheetViewsMap_Setup_v1.2.1.exe
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      placeholder: |
        1. Открыть окно «Виды на листах»
        2. Нажать «Обновить»
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
      description: Точный текст ошибки, если есть
    validations:
      required: true
  - type: checkboxes
    id: extra
    attributes:
      label: Дополнительно
      options:
        - label: Могу приложить лог из %LOCALAPPDATA%\SheetViewsMap (если есть)
